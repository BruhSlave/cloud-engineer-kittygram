name: Terraform

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Select the Terraform action"
        required: true
        default: "plan"
        options:
          - plan
          - apply
          - destroy

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.8.3

      - name: Set up Yandex Cloud service account key
        working-directory: ./infra
        run: |
          cat > authorized_key.json << 'EOF'
          ${{ secrets.YC_KEY_JSON }}
          EOF

      - name: Initialize Terraform
        working-directory: ./infra
        run: terraform init -backend-config="access_key=$ACCESS_KEY" -backend-config="secret_key=$SECRET_KEY"
        env:
          ACCESS_KEY: ${{ secrets.TERRAFORM_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.TERRAFORM_SECRET_KEY }}

      - name: Create teraform.tfvars
        working-directory: ./infra
        run: |
          cat > terraform.tfvars << EOF
          cloud_id = "${{ secrets.YC_CLOUD_ID }}"
          folder_id = "${{ secrets.YC_FOLDER_ID }}"
          ssh_key = "${{ secrets.TERRAFORM_SSH_KEY }}"
          static_ip = "${{ secrets.TERRAFORM_STATIC_IP"
          EOF

      - name: Terraform Plan
        working-directory: ./infra
        if: ${{ github.event.inputs.action == 'plan' }}
        run: terraform plan
        env:
          ACCESS_KEY: ${{ secrets.TERRAFORM_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.TERRAFORM_SECRET_KEY }}

      - name: Terraform Apply
        working-directory: ./infra
        if: ${{ github.event.inputs.action == 'apply' }}
        run: terraform apply -auto-approve
        env:
          ACCESS_KEY: ${{ secrets.TERRAFORM_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.TERRAFORM_SECRET_KEY }}

      - name: Terraform Destroy
        working-directory: ./infra
        if: ${{ github.event.inputs.action == 'destroy' }}
        run: terraform destroy -auto-approve
        env:
          ACCESS_KEY: ${{ secrets.TERRAFORM_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.TERRAFORM_SECRET_KEY }}
